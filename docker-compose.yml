services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-38090}
    ports:
      - "${KEYCLOAK_PORT:-38090}:8080"
    volumes:
      - ./keycloak/library-realm.json:/opt/keycloak/data/import/library-realm.json:ro

  postgres:
    image: postgres:13
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "${POSTGRES_PORT:-35432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  rating:
    build: ./rating
    image: ghcr.io/dra6666/lab5-rating:latest
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-38090}/realms/library
      OIDC_JWKS_URI: http://keycloak:8080/realms/library/protocol/openid-connect/certs
      OIDC_AUDIENCE: library-api
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ratings
      SPRING_DATASOURCE_USERNAME: program
      SPRING_DATASOURCE_PASSWORD: test
    ports:
      - "${RATING_PORT:-38050}:8050"

  library:
    build: ./library
    image: ghcr.io/dra6666/lab5-library:latest
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-38090}/realms/library
      OIDC_JWKS_URI: http://keycloak:8080/realms/library/protocol/openid-connect/certs
      OIDC_AUDIENCE: library-api
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/libraries
      SPRING_DATASOURCE_USERNAME: program
      SPRING_DATASOURCE_PASSWORD: test
    ports:
      - "${LIBRARY_PORT:-38060}:8060"

  reservation:
    build: ./reservation
    image: ghcr.io/dra6666/lab5-reservation:latest
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-38090}/realms/library
      OIDC_JWKS_URI: http://keycloak:8080/realms/library/protocol/openid-connect/certs
      OIDC_AUDIENCE: library-api
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reservations
      SPRING_DATASOURCE_USERNAME: program
      SPRING_DATASOURCE_PASSWORD: test
    ports:
      - "${RESERVATION_PORT:-38070}:8070"

  gateway:
    build: ./gateway
    image: ghcr.io/dra6666/lab5-gateway:latest
    restart: on-failure
    depends_on:
      - rating
      - library
      - reservation
    environment:
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-38090}/realms/library
      OIDC_JWKS_URI: http://keycloak:8080/realms/library/protocol/openid-connect/certs
      OIDC_TOKEN_URI: http://keycloak:8080/realms/library/protocol/openid-connect/token
      OIDC_AUDIENCE: library-api
      RATING_URL: http://rating:8050
      LIBRARY_URL: http://library:8060
      RESERVATION_URL: http://reservation:8070
    ports:
      - "${GATEWAY_PORT:-38080}:8080"

volumes:
  db-data:
