replicaCount: 1

image:
  repository: ghcr.io/dra6666/lab5-gateway
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: "library.example.com"
  path: /
  pathType: Prefix

env:
  - name: OIDC_TOKEN_URI
    value: "https://identity.example.com/realms/library/protocol/openid-connect/token"
  - name: OIDC_ISSUER
    value: "https://identity.example.com/realms/library"
  - name: OIDC_JWKS_URI
    value: "https://identity.example.com/realms/library/protocol/openid-connect/certs"
  - name: OIDC_AUDIENCE
    value: "library-api"
  - name: RATING_URL
    value: "http://rating:80"
  - name: LIBRARY_URL
    value: "http://library:80"
  - name: RESERVATION_URL
    value: "http://reservation:80"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 40
  periodSeconds: 5
  failureThreshold: 5
