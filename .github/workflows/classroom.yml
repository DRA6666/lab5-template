name: GitHub Classroom Workflow
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit and JWT security tests
        run: |
          for service in gateway library rating reservation; do
            mvn -B -ntp -f "$service/pom.xml" verify
          done
      - name: Build and start Docker services
        run: docker compose -p lab5-ci up -d --build
      - name: Wait for services and identity provider
        run: python3 scripts/wait-ready.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Newman
        run: npm install --global newman@6
      - name: Run original v4 API tests
        run: newman run v4/postman/collection.json -e v4/postman/environment.json --reporters cli,junit --reporter-junit-export test-results/postman.xml
      - name: Verify direct service authorization
        run: python3 scripts/security-smoke.py
      - uses: education/autograding@v1
      - name: Collect logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose -p lab5-ci logs --no-color > test-results/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab5-test-results
          path: |
            **/target/surefire-reports/
            test-results/
      - name: Stop test stack
        if: always()
        run: docker compose -p lab5-ci down -v
