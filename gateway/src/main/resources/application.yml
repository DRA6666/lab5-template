server:
  port: 8080
  shutdown: graceful
spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
rating-url: ${RATING_URL:http://localhost:8050}
library-url: ${LIBRARY_URL:http://localhost:8060}
reservation-url: ${RESERVATION_URL:http://localhost:8070}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
